<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="full-page">
        <div class="section-1 bg-image">
            <div id="company-bg">
                <div id="company-logo">
                    <img src="img/trending-up.svg" alt="trending up logo" width="100" height="100">
                    <h1>Accountant Studies</h1>
                </div>
            </div>
        </div>
        <div class="section-2">
            <div class="section-col">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want too.</p>
            </div>
            <div class="section-col">
                <h2>Let's do this!</h2>
                <form action="" method="post">
                    <fieldset>
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" name="first-name" id="first-name">
                        <label for="email">EMAIL</label>
                        <input type="email" name="email" id="email">
                        <label for="password">PASSWORD</label>
                        <input type="password" name="password" id="password">
                    </fieldset>
                    <fieldset>
                        <label for="last-name">LAST NAME</label>
                        <input type="text" name="last-name" id="last-name">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="tel" name="phone-number" id="phone-number">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" name="confirm-password" id="confirm-password">
                    </fieldset>
                </form>
            </div>
            <div class="section-col">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="">Login</a></p>
            </div>
        </div>
    </div>
</body>

</html>
