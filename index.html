<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <aside class="section-1 bg-image">
            <div id="company-bg">
                <div id="company-logo">
                    <img src="img/trending-up.svg" alt="trending up logo" width="100" height="100">
                    <h1>Accountant Studies</h1>
                </div>
            </div>
        </aside>
        <section class="section-2">
            <div class="section-col">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want too.</p>
            </div>
            <div class="section-col">
                <h2>Let's do this!</h2>
                <form id="createAccount" action="" method="post">
                    <div>
                        <span>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" name="first-name" id="first-name" autocomplete="name" required>
                        </span>
                        <span>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" name="last-name" id="last-name" required>
                        </span>
                    </div>
                    <div>
                        <span>
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email" autocomplete="email" required>
                        </span>
                        <span>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" name="phone-number" id="phone-number" required>
                        </span>
                    </div>
                    <div>
                        <span>
                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password" required>
                        </span>
                        <span>
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" name="confirm-password" id="confirm-password" required>
                        </span>
                    </div>
                </form>
            </div>
            <div class="section-col">
                <button type="submit" form="createAccount">Create Account</button>
                <p>Already have an account? <a href="">Login</a></p>
            </div>
        </section>
    </main>
</body>

</html>
