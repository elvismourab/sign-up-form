<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="full-page">
        <!-- div com imagem + logo -->
        <div class="section">
            <div id="company-logo">
                <img src="trending-up.svg" alt="trending up logo">
                <h1>Accountant Studies</h1>
            </div>
        </div>

        <!-- div do form -->
        <div class="section">
            <div>
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up now to get started.</p>
                <p>You know you want too.</p>
            </div>
            <div>
                <form action="" method="post">
                    <p>Let's do this!</p>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" name="first-name" id="first-name">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" name="last-name" id="last-name">
                    <label for="email">EMAIL</label>
                    <input type="email" name="email" id="email">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="tel" name="phone-number" id="phone-number">
                    <label for="password">PASSWORD</label>
                    <input type="password" name="password" id="password">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" name="confirm-password" id="confirm-password">
                </form>
            </div>
            <div>
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="">Login</a></p>
            </div>
        </div>
    </div>
</body>

</html>
